
name: Task Manager CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Python version and commit
        run: |
          docker run --rm python:3.12.7-slim python --version
          echo "Commit: $GITHUB_SHA"

      - name: Check files and APP_PORT
        env:
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          test -f task_app.py
          test -f tests/test_task_app.py
          test -f README.md
          test -f Dockerfile
          test -f tasks.json.example

          if [ "$APP_PORT" != "8101" ]; then
            echo "::error::APP_PORT must be 8101"
            exit 1
          fi

      - name: Compile Python files
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.12.7-slim \
            sh -c 'python -m compileall -q . && python -m py_compile task_app.py tests/*.py'


  unit_tests:
    name: unit_tests
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run unit tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.12.7-slim \
            python -m unittest discover -s tests -v


  package:
    name: package
    needs: [validate, unit_tests]

    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create distribution
        run: |
          rm -rf dist
          mkdir -p dist

          cp task_app.py README.md Dockerfile tasks.json.example dist/

          {
            echo "CI_COMMIT_SHA=$GITHUB_SHA"
            echo "CI_PIPELINE_ID=$GITHUB_RUN_ID"
            echo "FILES:"
            find dist -maxdepth 1 -type f ! -name manifest.txt -printf '%f\n' | sort
          } > dist/manifest.txt

          cat dist/manifest.txt

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: task-app-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error


  deploy_test:
    name: deploy_test
    needs: package

    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: test/tasks
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download distribution
        uses: actions/download-artifact@v5
        with:
          name: task-app-dist
          path: deploy/test

      - name: Check deployment secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is not configured"
            exit 1
          fi

          echo "DEPLOY_TOKEN is configured."

      - name: Check copied files
        run: |
          test -f deploy/test/task_app.py
          test -f deploy/test/manifest.txt

          echo "Artifact copied to deploy/test"
          cat deploy/test/manifest.txt

      - name: Run smoke test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.12.7-slim \
            python scripts/smoke_test.py deploy/test/task_app.py

      - name: Upload deployment report
        uses: actions/upload-artifact@v7
        with:
          name: deployment-report
          path: deployment.txt
          retention-days: 7
          if-no-files-found: error

